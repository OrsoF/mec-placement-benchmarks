[pytest]
testpaths = tests
addopts = -m "not slow and not integration"
markers =
    slow: long-running test or experiment-style workflow
    integration: workflow that exercises external solvers, training, artifacts, or optional stacks
    requires_rl: requires stable-baselines3/torch RL dependencies
    requires_pyomo: requires pyomo and usually an external mathematical-programming solver
    requires_cma: requires the cma package
