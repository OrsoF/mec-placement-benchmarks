[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mec-placement-benchmarks"
version = "0.1.0"
description = "Service placement benchmarks for mobile edge computing"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.24", "networkx>=2.8"]

[project.optional-dependencies]
benchmarks = ["pandas>=1.5", "matplotlib>=3.6", "tqdm>=4.64"]
exact = ["pyomo>=6.7"]
gurobi = ["gurobipy>=10"]
evolutionary = ["cma>=3.3", "tqdm>=4.64"]
environments = ["gymnasium>=0.29", "matplotlib>=3.6"]
rl = ["gymnasium>=0.29", "stable-baselines3>=2.2", "torch>=2", "matplotlib>=3.6"]
test = ["pytest>=7", "build>=1"]

[project.scripts]
mecbench = "mecbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["mecbench*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "--import-mode=importlib"
